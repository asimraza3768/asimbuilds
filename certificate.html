<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Viewer | Asim Builds</title>
    <link rel="canonical" href="https://asimbuilds.dev/certificate.html">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="nav-container">
            <a href="index.html" class="logo">Asim Builds</a>
            <div class="nav-actions">
                <a href="index.html" class="btn btn-secondary">Back to Website</a>
            </div>
        </nav>
    </header>

    <main class="container" style="padding-top: 4rem; min-height: 80vh;">
        <div id="cert-content">
            <!-- Populated by JS -->
            <h1 class="section-title">Loading Certificate...</h1>
        </div>
    </main>

    <script src="certificates.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const certId = urlParams.get('id');
            const container = document.getElementById('cert-content');

            if (certId && certificatesData[certId]) {
                const cert = certificatesData[certId];
                const pdfPath = `assets/certificates/${cert.file}`;
                
                document.title = `${cert.title} - Certificate | Asim Builds`;

                container.innerHTML = `
                    <h1 class="section-title" style="margin-bottom: 0.5rem;">${cert.title}</h1>
                    <p style="font-weight: 600; color: var(--accent-color); margin-bottom: 1rem;">Provider: ${cert.provider}</p>
                    <p class="section-subtitle">${cert.description}</p>
                    
                    <div style="margin-bottom: 2rem; display: flex; gap: 1rem;">
                        <a href="${pdfPath}" download class="btn btn-primary">Download Certificate</a>
                        <a href="index.html" class="btn btn-secondary">Back to Home</a>
                    </div>

                    <div class="pdf-viewer-container">
                        <iframe src="${pdfPath}" title="${cert.title} Certificate">
                            <p>Your browser does not support PDFs. <a href="${pdfPath}">Download the PDF</a>.</p>
                        </iframe>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <h1 class="section-title">Certificate Not Found</h1>
                    <p>The requested certificate could not be located in the directory.</p>
                    <a href="index.html" class="btn btn-primary" style="margin-top: 2rem;">Return Home</a>
                `;
            }
        });
    </script>
</body>
</html>
